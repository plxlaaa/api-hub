# ============================================================
#  API Hub nginx 反向代理示例
#  安装：
#    sudo cp deploy/nginx/api-hub.conf /etc/nginx/conf.d/api-hub.conf
#    # HTTP/2 片段需按 nginx 版本生成，见 api-hub-http2.conf 内的说明
#    sudo cp deploy/nginx/api-hub-http2.conf /etc/nginx/snippets/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  需先申请证书（certbot / acme.sh 任选其一）。
#  仓库自带 Caddyfile 可一步自动签 HTTPS，二选一即可。
#
#  ⚠️ 本文件被 include 进 http 上下文，因此 limit_req_zone 放在 server 块之外。
#     它只在 server 块内使用是无效的（nginx 会报 "directive is not allowed here"）。
# ============================================================

# 单IP 登录限流兜底（网关自身按统一 Key 限速，这里只挡扫描器）。
# 声明必须位于 http 上下文 —— 本文件整体处于该上下文，直接写在顶层即可。
limit_req_zone $binary_remote_addr zone=api_hub_login:10m rate=30r/m;

upstream api_hub {
    # 应用侧已用Environment=HOSTNAME=127.0.0.1 只监听本机
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name hub.example.com;

    # ACME 质询走 HTTP，其余一律跳HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # HTTP/2：nginx >= 1.25 用独立指令 `http2 on;`；
    # 更早的版本（含 Ubuntu 22.04 自带的 1.18）只认 listen 参数里的 http2。
    # 两者并存会被新版本视为重复而报错，故用 include 在加载期由版本决定写哪一个。
    include /etc/nginx/snippets/api-hub-http2.conf;
    server_name hub.example.com;

    ssl_certificate     /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # SSE 流式输出：必须关闭缓冲，否则回答会被攒住一次性吐出
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    # 长回答首字节可能较慢，网关自身已有 300s 上游超时，这里留足余量
    proxy_connect_timeout 10s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://api_hub;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 需要 Connection 保持
        proxy_set_header Connection        "";
    }

    # 登录接口额外收紧：防爆破（应用内已有 5 次锁 10 分钟，此处为网络层前置）
    location = /api/auth/login {
        limit_req zone=api_hub_login burst=5 nodelay;
        proxy_pass http://api_hub;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查不对公网暴露
    location = /api/health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://api_hub;
        proxy_set_header Host $host;
    }

    # 客户端上传/请求体上限（网关自身限制 10MB，这里留 12MB 余量）
    client_max_body_size 12m;
}