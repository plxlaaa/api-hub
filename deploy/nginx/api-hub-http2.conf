# ============================================================
#  API Hub · HTTP/2 启用片段
#  由 deploy/nginx/api-hub.conf 的 server 块 include。
#
#  为什么要拆成片段：nginx 对 HTTP/2 的写法在1.25 发生过不兼容变更 ——
#   - nginx >= 1.25：`http2 on;`独立指令
#   - nginx <  1.25：必须写在 listen 参数里（`listen 443 ssl http2;`）
#  同一份配置想同时兼容两种版本，只能按版本生成对应片段，
#  否则新版本会因 http2 重复声明而报错、老版本会因未知指令而启动失败。
#
#  安装（由 INSTALL.md 的命令自动生成，无需手写）：
#   sudo mkdir -p /etc/nginx/snippets
#   sudo tee /etc/nginx/snippets/api-hub-http2.conf >/dev/null <<'EOF'
#   # 你的 nginx 版本
#   http2 on;
#   EOF
#   sudo nginx -t && sudo systemctl reload nginx
#
#  查看当前版本：nginx -v
#  · 1.25及以上 → 用 `http2 on;`
#  · 1.25 以下  → 删掉本文件的内容，并把 api-hub.conf 里443 那行改成：
#                  listen 443 ssl http2;
# ============================================================

http2 on;