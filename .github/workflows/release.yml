name: Release

# 打 tag（如 v1.0.1）自动打包三平台附件并发布 Release
# 与 ripgrep / bat 等项目的发版方式一致
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 打包三平台
        run: |
          V="${GITHUB_REF_NAME}"
          mkdir -p dist pkg

          # Linux (x86_64) —— tar.gz 惯例
          mkdir -p "pkg/api-hub-${V}-linux-x64"
          cp install-api-hub.sh doctor.mjs "pkg/api-hub-${V}-linux-x64/"
          tar czf "dist/api-hub-${V}-linux-x64.tar.gz" -C pkg "api-hub-${V}-linux-x64"

          # Windows (x86_64) —— zip 惯例
          mkdir -p "pkg/api-hub-${V}-windows-x64"
          cp install-api-hub.ps1 doctor.mjs "pkg/api-hub-${V}-windows-x64/"
          (cd pkg && zip -rq "../dist/api-hub-${V}-windows-x64.zip" "api-hub-${V}-windows-x64")

          # Docker
          mkdir -p "pkg/api-hub-${V}-docker"
          cp Dockerfile docker-compose.yml .env.example doctor.mjs "pkg/api-hub-${V}-docker/"
          (cd pkg && zip -rq "../dist/api-hub-${V}-docker.zip" "api-hub-${V}-docker")

          # 配对 .sha256（ripgrep 惯例）
          cd dist
          for f in api-hub-*; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: 发布 Release 并上传附件
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
